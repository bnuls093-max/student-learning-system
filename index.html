<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оқу платформасы - Кіру</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-box">
    <h1>Жеке оқу жүйесі</h1>
    <p class="subtitle">Студенттерге арналған оқу материалдары</p>

    <div class="tabs">
      <button id="tabLogin" class="tab active" type="button">Кіру</button>
      <button id="tabRegister" class="tab" type="button">Тіркелу</button>
    </div>

    <!-- Кіру формасы -->
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="example@mail.com" required>

      <label for="loginPassword">Құпиясөз</label>
      <input type="password" id="loginPassword" placeholder="Құпиясөз" required>

      <button type="submit" class="btn">Кіру</button>
      <p id="loginMessage" class="message"></p>
    </form>

    <!-- Тіркелу формасы -->
     <form id="registerForm" class="hidden" novalidate>
      <label for="regName">Аты-жөні</label>
      <input type="text" id="regName" placeholder="Аты-жөніңіз" required>

      <label for="regEmail">Email</label>
      <input type="text" id="regEmail" placeholder="example@gmail.com" required>
      <p id="emailError" class="field-error"></p>

      <label for="regPassword">Құпиясөз</label>
      <input type="password" id="regPassword" placeholder="Құпиясөз" required>
      <p id="passwordStrength" class="strength"></p>

      <button type="submit" class="btn">Тіркелу</button>
      <p id="registerMessage" class="message"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
